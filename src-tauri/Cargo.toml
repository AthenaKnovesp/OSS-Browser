[package]
name = "oss-browser"
version = "0.1.0"
description = "Windows desktop S3 compatible object storage browser"
license = "MIT"
repository = "https://github.com/AthenaKnovesp/OSS-Browser"
edition = "2024"
rust-version = "1.94.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
aws-sdk-s3 = { version = "1.159.0", default-features = false, features = ["http-1x", "default-https-client", "rt-tokio"] }
aws-smithy-types = { version = "1.9.4", features = ["http-body-1-x"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
http-body-util = "0.1"
mime_guess = "2"
regex = "1"
base64 = "0.23"
md-5 = "0.11"
sha2 = "0.11"
crc32fast = "1"
url = "2"
percent-encoding = "2"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
axum = "0.8"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
strip = true

